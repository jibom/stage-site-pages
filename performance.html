function openM(g){

 document.getElementById('mask').classList.add('show');
 var old=document.getElementById('mChart2');if(old)old.remove();

 var wkSet={};wk.forEach(function(w){wkSet[w]=1;});
 var sc=[];SPY.week.forEach(function(w,i){if(wkSet[w])sc.push(SPY.close[i]);});

  {displayModeBar:false,responsive:true});
